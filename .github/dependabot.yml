# Dependency updates.
#
# Weekly rather than daily: this is a two-person shop's till software, and a
# constant trickle of PRs gets ignored, which is worse than a batch that gets
# read. Security updates arrive immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn; majors still come individually so
      # they get looked at.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Next/React majors are a migration, not a dependency bump.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
